<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rescribe</title>
    <link rel="stylesheet" href="stop.css" />
  </head>
  <body>
    <main>
      <header>
        <span id="state" class="pill">…</span>
        <span id="elapsed" class="elapsed"></span>
      </header>
      <h1 id="title">Rescribe</h1>
      <p class="question">What should happen to it?</p>
      <div id="choices" class="choices">
        <button id="save" class="choice primary" disabled>
          <span class="label">Save</span>
          <span id="where" class="sub">Video and transcript into the folder</span>
        </button>
      </div>
      <p id="routines-note" class="hint" hidden></p>
      <div class="actions">
        <span id="discard-slot"></span>
      </div>
      <p id="status" class="hint" aria-live="polite"></p>
      <p id="footer" class="hint"></p>
    </main>
    <script type="module" src="stop.js"></script>
  </body>
</html>
